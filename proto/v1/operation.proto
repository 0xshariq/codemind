syntax = "proto3";

package codemind.v1;

import "v1/common.proto";

message ProgressEvent {
  string event_id = 1;
  uint64 sequence = 2;
  string engine = 3;
  string stage = 4;
  string timestamp = 5;
  Correlation correlation = 6;
  RepositoryContext context = 7;
  string message = 8;
  string stage_state = 9;
}

message StreamProgressRequest {
  RepositoryContext context = 1;
  string operation_id = 2;
  uint64 after_sequence = 3;
  uint32 limit = 4;
}

message StartInvestigationRequest {
  RepositoryContext context = 1;
  string source_path = 2;
  string symbol_name = 3;
  Correlation correlation = 4;
}

message StartInvestigationResponse {
  string operation_id = 1;
  RepositoryContext context = 2;
  string selected_entity_id = 3;
}

service OperationService {
  rpc StartInvestigation(StartInvestigationRequest) returns (StartInvestigationResponse);
  rpc StreamProgress(StreamProgressRequest) returns (stream ProgressEvent);
}
