syntax = "proto3";

package codemind.v1;

import "v1/common.proto";

message SymbolRelationshipQuery {
  string symbol_id = 1;
  uint32 limit = 2;
  RepositoryContext context = 3;
  Correlation correlation = 4;
}

message SearchCodeQuery {
  string query = 1;
  uint32 limit = 2;
  RepositoryContext context = 3;
  Correlation correlation = 4;
}

message ChangeAnalysisQuery {
  string symbol_id = 1;
  uint32 max_depth = 2;
  RepositoryContext context = 3;
  Correlation correlation = 4;
}

message QueryResponse {
  oneof result {
    CanonicalResult data = 1;
    ErrorStatus error = 2;
  }
}

service IntelligenceService {
  rpc SearchCode(SearchCodeQuery) returns (QueryResponse);
  rpc QuerySymbolRelationships(SymbolRelationshipQuery) returns (QueryResponse);
  rpc AnalyzeChange(ChangeAnalysisQuery) returns (QueryResponse);
}
